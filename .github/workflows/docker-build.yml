name: Docker Build & Publish

# 任何 push 到 main（含 GitHub API 提交）即触发：构建 → 冒烟测试 → 推送 GHCR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/yuanshandalishuishou/deepseek-harness-zulin
  TEST_CONTAINER: aio-ci

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 1. 构建（桩模式默认开启，先 load 到本地用于测试，不推送）----
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aio-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 2. 启动测试容器（路径模式 + DSH 端口网关 + 自签证书）----
      - name: Start test container
        run: |
          docker run -d --name ${{ env.TEST_CONTAINER }} \
            -p 80:80 -p 443:443 -p 3080:3080 \
            -e DOMAIN=localhost \
            -e ACCESS_MODE=path \
            -e ADMIN_PASSWORD=admin \
            -e ENABLE_DSH_PORT=true \
            aio-platform:test

      - name: Wait for container healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.TEST_CONTAINER }} 2>/dev/null || echo starting)
            echo "[$i] health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "容器未在 5 分钟内就绪，输出日志："
          docker logs ${{ env.TEST_CONTAINER }} 2>&1 | tail -50
          exit 1

      # ---- 3. 冒烟测试（方案文档 2.16 节全项；失败则终止，不推送镜像）----
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh ${{ env.TEST_CONTAINER }} admin

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== docker ps ====="
          docker ps -a || true
          echo "===== container logs ====="
          docker logs ${{ env.TEST_CONTAINER }} 2>&1 | tail -100 || true
          echo "===== processes ====="
          docker exec ${{ env.TEST_CONTAINER }} ps aux || true
          echo "===== supervisorctl ====="
          docker exec ${{ env.TEST_CONTAINER }} supervisorctl status || true
          echo "===== supervisor logs ====="
          docker exec ${{ env.TEST_CONTAINER }} bash -c 'tail -40 /var/log/supervisor/*.log 2>/dev/null' || true
          echo "===== nginx error.log ====="
          docker exec ${{ env.TEST_CONTAINER }} bash -c 'tail -30 /var/log/nginx/error.log 2>/dev/null' || true
          echo "===== healthz 直连 ====="
          docker exec ${{ env.TEST_CONTAINER }} bash -c 'curl -ksS -o /dev/null -w "https /healthz -> %{http_code}\n" https://127.0.0.1/healthz; curl -sS -o /dev/null -w "http  / -> %{http_code}\n" http://127.0.0.1/' || true
          echo "===== status.json ====="
          docker exec ${{ env.TEST_CONTAINER }} bash -c 'cat /var/www/html/status.json 2>/dev/null || echo MISSING' || true

      # ---- 4. 推送 GHCR（复用 GHA 缓存，秒级完成）----
      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - name: Image summary
        run: |
          echo "镜像已推送:"
          echo "  ${{ env.IMAGE }}:latest"
          echo "  ${{ env.IMAGE }}:${{ github.sha }}"
