# =============================================================================
# 推送即自动构建 Docker 镜像并发布到 GHCR（GitHub Container Registry）
# - 推送到 main 分支  -> 构建 ghcr.io/<owner>/<repo>:latest
# - 推送 v1.0.0 等 tag -> 构建 ghcr.io/<owner>/<repo>:1.0.0 和 :1.0
# - 手动触发         -> Actions 页面点 "Run workflow"
# 使用内置 GITHUB_TOKEN，无需额外配置任何 Secret
# 注意：镜像仅构建 linux/amd64（Dockerfile 中 Node.js 为 x64 二进制）
# =============================================================================
name: Build Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository 自动解析为 <owner>/<repo>，且全部小写（GHCR 要求）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
