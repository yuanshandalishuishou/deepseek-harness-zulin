; Supervisor 主配置
; 启动顺序: status-aggregator(5) → 业务服务(20，conf.d/svc-*) → cron/sshd(30) → nginx(40)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[include]
files = /etc/supervisor/conf.d/*.conf

[program:status-aggregator]
command=/etc/aio/scripts/status-aggregator.sh
priority=5
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
